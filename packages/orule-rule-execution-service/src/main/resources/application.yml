spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: orule-rule-execution-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  # ============================================================
  # Kafka producer (TASK-2.3.1)
  # Real broker addresses are injected via SPRING_KAFKA_BOOTSTRAP_SERVERS
  # in prod profile; dev defaults to localhost so unit tests do not need a broker.
  # ============================================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000

# ============================================================
# Default (loaded for ALL profiles): server, rule-management,
# feign, orule, management, resilience4j.
# 参考 RFC-0040 §3.5 / §3.13
# ============================================================
server:
  port: 8081

rule-management:
  base-url: ${RULE_MGMT_URL:http://rule-management-service:8080}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC

orule:
  execution:
    timeout-ms: 30000
    # 同步 RuleExecutor 线程池（§3.6 TASK-1.2.5），保留为向后兼容键名。
    # 历史 key：orule.execution.pool.*，新代码不应再引用。
    pool:
      core-size: 16
      max-size: 32
      queue-capacity: 64
    # 异步 RuleSet 调度线程池（§3.6 / §3.12 / TASK-2.1.1 / TASK-2.1.3），
    # AsyncThreadPoolConfig 引用此命名空间。
    async:
      pool:
        core-size: 20
        max-size: 50
        queue-capacity: 500
        thread-name-prefix: rule-set-
        # 默认继续策略：CallerRunsPolicy（§3.6）
        rejection-policy: CALLER_RUNS
    groovy:
      cache:
        max-size: 1000
        expire-after-access-minutes: 10
    events:
      rule-set-completed-topic: rule-set-execution-completed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    ratelimiters:
      enabled: true

# ============================================================
# Resilience4j rate-limiter (TASK-3.2.2)
# Default: 100 req/sec per instance for rule-execute endpoints.
# Override per-instance via env RESILIENCE4J_LIMIT_REFRESH_PERMITS.
# ============================================================
resilience4j:
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
    instances:
      ruleExecute:
        base-config: default

logging:
  level:
    root: INFO
    com.orule: INFO

---
# ============================================================
# dev profile: H2 in-memory + Flyway H2 兼容脚本
# 参考 RFC-0040 §14.2，dev 用于单机开发
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:orule_res;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration/h2
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ============================================================
# prod profile: PostgreSQL + Flyway PG 脚本
# 参考 RFC-0040 §14.1 / §14.2，prod 用于生产
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres.orule.svc}:${DB_PORT:5432}/${DB_NAME:orule}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:orule}
    password: ${DB_PASSWORD:orule}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/postgresql
