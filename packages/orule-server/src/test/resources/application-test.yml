spring:
  datasource:
    url: jdbc:h2:mem:orule-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholder: false

  h2:
    console:
      enabled: false

orule:
  artifact-storage:
    type: local
    local:
      base-path: ${java.io.tmpdir}/orule-test-artifacts-${random.uuid}
      base-url: http://localhost:8080/api/v1/artifacts

logging:
  level:
    com.orule: DEBUG
    org.hibernate.SQL: WARN
